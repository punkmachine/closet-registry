packages:
  - "apps/*"
  # - "packages/*"

catalog:
  "@types/node": ^22.20.1
  zod: ^4.4.3
  vitest: ^5.0.3

catalogs:
  # Два мажора TS — осознанно: registry на нативном Go-порте, admin-panel на 5.9
  # из-за vue-tsc. Разнесено по именованным каталогам, чтобы расхождение было видно.
  ts7:
    typescript: ^7.0.2
  ts59:
    typescript: ~5.9.0

allowBuilds:
  esbuild: true
  "@parcel/watcher": true
  better-sqlite3: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - pg-protocol@1.16.0
  - pg@8.23.0
