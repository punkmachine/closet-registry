packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@types/node": ^22.20.1
  typescript: ~5.9.0
  zod: ^4.4.3
  vitest: ^5.0.3
  "@vitest/coverage-v8": ^5.0.3
  happy-dom: ^20.14.6

allowBuilds:
  esbuild: true
  "@parcel/watcher": true
  better-sqlite3: true
  sharp: true
  unrs-resolver: true
  simple-git-hooks: true
minimumReleaseAgeExclude:
  - pg-protocol@1.16.0
  - pg@8.23.0
