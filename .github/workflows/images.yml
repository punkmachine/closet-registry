name: images

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/registry/**"
      - "apps/admin-panel/**"
      - "docker/*.Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/images.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: docker/registry.Dockerfile
            image: ghcr.io/punkmachine/closet-registry-api
          - name: admin
            file: docker/admin-panel.Dockerfile
            image: ghcr.io/punkmachine/closet-registry-admin
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          # PR — только amd64 и без публикации. master/tag — оба архива в GHCR.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
